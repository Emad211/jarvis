_config_version: 39
approvals:
  destructive_slash_confirm: false
auxiliary:
  free_only: true
command_allowlist:
  - script execution via heredoc
  - delete in root path
  - force kill processes
  - command parser limit or malformed executable payload
  - execute_code
  - script execution via -e/-c flag
compression:
  threshold_tokens: 300000
model:
  provider: google_ai_studio
  api_mode: chat_completions
  default: gemini-3.8-flash
  aliases:
    chat: google_ai_studio/gemini-3.5-flash
    img: google_ai_studio/gemini-3.1-flash-image
    img-pro: google_ai_studio/gemini-3-pro-image
    img-nano: google_ai_studio/nano-banana-pro-preview
    tts: google_ai_studio/gemini-3.8-flash-tts
    tts-pro: google_ai_studio/gemini-2.5-pro-preview-tts
    tts-2.5-flash: google_ai_studio/gemini-2.5-flash-preview-tts
    tts-3.1-flash: google_ai_studio/gemini-3.1-flash-tts-preview
    music: google_ai_studio/lyria-3.5
    music-pro: google_ai_studio/lyria-3-pro-preview
    music-clip: google_ai_studio/lyria-3-clip-preview
    agent: google_ai_studio/gemini-2.5-computer-use-preview-10-2025
    agent-antigrav: google_ai_studio/antigravity-preview-latest
    agent-antigrav2: google_ai_studio/antigravity-preview-09-2026
    research: google_ai_studio/deep-research-max-preview-04-2026
    research-pro: google_ai_studio/deep-research-pro-preview-12-2025
    research-standard: google_ai_studio/deep-research-preview-04-2026
    embed: google_ai_studio/gemini-embedding-2
    embed-preview: google_ai_studio/gemini-embedding-2-preview
    embed-001: google_ai_studio/gemini-embedding-001
    stt: google_ai_studio/gemini-3.5-transcribe
    free: openrouter/minimax/minimax-m3.1-flash:free
    ultra: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
    chat-pro: google_ai_studio/gemini-4-argon
    argon: google_ai_studio/gemini-4-argon
    sol: agentrouter/gpt-6.1-sol
onboarding:
  seen:
    busy_input_prompt: true
platforms:
  api_server:
    enabled: true
    extra:
      host: 127.0.0.1
      port: 8642
plugins:
  disabled: []
  enabled: []
  entries:
    antigravity-oauth:
      allow_tool_override: false
providers:
  agentrouter:
    name: AgentRouter
    base_url: https://agentrouter.org
    api_mode: anthropic_messages
    key_env: AGENTROUTER_API_KEY
    model: gpt-6.1-sol
    extra_headers:
      User-Agent: claude-cli/1.0.0 (external, cli)
    models:
      gpt-6.1-sol:
        display_name: GPT 6.1 Sol
      gpt-6-astra:
        display_name: GPT 6 Astra
  antigravity:
    api_key: antigravity-local
    base_url: http://127.0.0.1:8790/v1
    default_model: gemini-3.8-flash-high
    models:
      - gemini-3.8-flash-high
      - gemini-3.8-flash-medium
      - gemini-3.8-flash-low
      - gemini-3.7-flash-high
      - gemini-3.7-flash-medium
      - gemini-3.7-flash-low
      - gemini-3.6-flash-high
      - gemini-3.6-flash-medium
      - gemini-3.6-flash-low
      - gemini-3.1-pro-high
      - gemini-3.1-pro-low
      - claude-sonnet-4-6
      - claude-opus-4-6-thinking
      - gpt-oss-120b-medium
    name: Google Antigravity
  groq:
    name: Groq
    api: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY
    transport: chat_completions
    models:
      - openai/gpt-oss-120b
      - moonshotai/kimi-k2-instruct
  cerebras:
    name: Cerebras
    api: https://api.cerebras.ai/v1
    key_env: CEREBRAS_API_KEY
    transport: chat_completions
    models:
      - gpt-oss-120b
  mistral:
    name: Mistral
    api: https://api.mistral.ai/v1
    key_env: MISTRAL_API_KEY
    transport: chat_completions
    models:
      - mistral-medium-latest
  google_ai_studio:
    name: Google AI Studio
    api: https://generativelanguage.googleapis.com/v1beta/openai
    key_env: GOOGLE_AI_STUDIO_API_KEY
    transport: chat_completions
    default_model: gemini-3.5-flash
    models:
      gemini-3.8-flash:
        display_name: Gemini 3.8 Flash
        context_length: 1048576
        max_tokens: 65536
        supports_tools: true
        supports_vision: true
      gemini-3.7-flash:
        display_name: Gemini 3.7 Flash
        context_length: 1048576
        max_tokens: 65536
        supports_tools: true
        supports_vision: true
      gemini-3.6-flash:
        display_name: Gemini 3.6 Flash
        context_length: 1048576
        max_tokens: 65536
        supports_tools: true
        supports_vision: true
      gemini-3.5-flash:
        display_name: Gemini 3.5 Flash
        context_length: 1048576
        max_tokens: 65536
        supports_tools: true
        supports_vision: true
      gemini-3.5-flash-lite:
        display_name: Gemini 3.5 Flash Lite
        context_length: 1048576
        max_tokens: 65536
        supports_tools: true
        supports_vision: true
      gemini-3.1-flash-lite:
        display_name: Gemini 3.1 Flash Lite
        context_length: 1048576
        max_tokens: 65536
        supports_tools: true
        supports_vision: true
      gemini-2.5-flash:
        display_name: Gemini 2.5 Flash
        context_length: 1048576
        max_tokens: 65536
        supports_tools: true
        supports_vision: true
      gemini-3.1-pro-preview:
        display_name: Gemini 3.1 Pro (needs paid tier)
        context_length: 1048576
        max_tokens: 65536
        supports_tools: true
        supports_vision: true
      gemini-4-argon:
        display_name: Gemini 4 Argon (needs paid tier)
        context_length: 1048576
        max_tokens: 32768
        supports_tools: true
        supports_vision: true
      gemma-4-31b-it:
        display_name: Gemma 4 31B
        context_length: 262144
        max_tokens: 32768
        supports_tools: true
        supports_vision: true
quick_commands:
  flash:
    description: Gemini 3.5 Flash (AI Studio)
    type: alias
    target: /model gemini-3.5-flash --provider google_ai_studio
stt:
  language: fa
  provider: gemini
  gemini:
    model: gemini-3.5-transcribe
    api_key_env: GOOGLE_AI_STUDIO_API_KEY
timezone: Asia/Tehran
tts:
  elevenlabs:
    model_id: eleven_v4_turbo
    voice_id: XzieuK0bwYWT9Kl1LhLs
  provider: gemini
  gemini:
    voice: Kore
    api_key_env: GOOGLE_AI_STUDIO_API_KEY
    model: gemini-3.8-flash-tts
voice:
  auto_tts: false
streaming:
  enabled: true
  transport: auto
  edit_interval: 1.2
  buffer_threshold: 24
  cursor: ' ▉'
  fresh_final_after_seconds: 0.0
display:
  streaming: true
  show_reasoning: false
  tool_progress: all
delegation:
  max_concurrent_children: 3
credential_pool_strategies:
  openrouter: round_robin
  agentrouter: round_robin
fallback_providers:
  - provider: google_ai_studio
    model: gemini-3.8-flash
  - provider: google_ai_studio
    model: gemini-3.5-flash-lite
  - provider: openrouter
    model: minimax/minimax-m3.1-flash:free
  - provider: openrouter
    model: nvidia/nemotron-3-ultra-550b-a55b:free
  - provider: agentrouter
    model: gpt-6.1-sol
  - provider: antigravity
    model: gemini-3.8-flash-high
agent:
  reasoning_effort: xhigh
